<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        th, td {
            text-align: center !important;
            vertical-align: middle !important;
        }
        .sidebar {
            height: 100vh;
            position: fixed;
        }
        .nav-link.active-tab {
            background-color: #007bff !important;
            color: white !important;
        }
        .main-panel {
            background-color: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

<!-- Верхняя панель -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <b th:text="${#authentication.name}"></b> with roles:
        <span th:each="role : ${#authentication.authorities}" th:text="${role.toString()} + ' '"></span>
    </span>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-light">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column" id="sideTabs">
                    <li class="nav-item">
                        <a class="nav-link" id="adminTabLink" data-bs-toggle="tab" href="#adminPanel">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="userTabLink" data-bs-toggle="tab" href="#userPanel">User</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Основной контент -->
        <main class="col-md-10 ms-sm-auto px-4">
            <div class="tab-content">
                <!-- Вкладка Admin -->
                <div id="adminPanel" class="tab-pane fade show active">
                    <h2 class="mt-3">Admin panel</h2>

                    <!-- Вкладки внутри Admin -->
                    <ul class="nav nav-tabs">
                        <li class="nav-item">
                            <a class="nav-link active" data-bs-toggle="tab" href="#usersTable">Users Table</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="tab" href="#newUser">New User</a>
                        </li>
                    </ul>

                    <!-- Контент вкладок -->
                    <div class="tab-content mt-3">
                        <div id="usersTable" class="tab-pane fade show active">
                            <h4>All users</h4>
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered">
                                    <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <!-- Строки добавляются через JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div id="newUser" class="tab-pane fade">
                            <h4>Add new user</h4>
                            <!-- Форма для добавления нового пользователя -->
                            <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
                                <form id="addUserForm" class="w-25 mx-auto">
                                    <div class="mb-3">
                                        <label for="name" class="form-label text-center fw-bold d-block">First name</label>
                                        <input type="text" class="form-control" id="name" placeholder="Enter name" required />
                                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                                    </div>

                                    <div class="mb-3">
                                        <label for="surname" class="form-label text-center fw-bold d-block">Last name</label>
                                        <input type="text" class="form-control" id="surname" placeholder="Enter surname" required />
                                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                                    </div>

                                    <div class="mb-3">
                                        <label for="age" class="form-label text-center fw-bold d-block">Age</label>
                                        <input type="number" class="form-control" id="age" placeholder="Enter age" required />
                                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                                    </div>

                                    <div class="mb-3">
                                        <label for="userName" class="form-label text-center fw-bold d-block">Email</label>
                                        <input type="text" class="form-control" id="userName" placeholder="Enter email" required />
                                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label text-center fw-bold d-block">Password</label>
                                        <input type="password" class="form-control" id="password" placeholder="Enter password" required />
                                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                                    </div>

                                    <div class="mb-3">
                                        <label for="userRole" class="form-label text-center fw-bold d-block">Role</label>
                                        <select class="form-select" id="userRole" multiple>
                                            <option value="ADMIN" data-role-id="2">ADMIN</option>
                                            <option value="USER" data-role-id="1">USER</option>
                                        </select>
                                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                                    </div>
                                    <button type="submit" class="btn btn-success w-100">Add new user</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Вкладка User -->
                <div id="userPanel" class="tab-pane fade">
                    <h2 class="mt-3">User information-page</h2>

                    <!-- Карточка "About user" -->
                    <div class="card mt-3">
                        <div class="card-header">
                            <h4>About user</h4>
                        </div>
                        <div class="card-body">
                            <table class="table table-bordered">
                                <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr>
                                    <td th:text="${activeUser.id}"></td>
                                    <td th:text="${activeUser.name}"></td>
                                    <td th:text="${activeUser.surname}"></td>
                                    <td th:text="${activeUser.age}"></td>
                                    <td th:text="${activeUser.username}"></td>
                                    <td>
                                        <span th:each="role : ${activeUser.roles}" th:text="${role.name} + ' '"></span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Модальное окно для редактирования пользователя -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editUserForm">
                    <div class="mb-3 text-center">
                        <label for="editId" class="form-label fw-bold d-block">ID</label>
                        <input type="text" class="form-control" id="editId" readonly>
                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editName" class="form-label fw-bold d-block">First Name</label>
                        <input type="text" class="form-control" id="editName">
                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editSurname" class="form-label fw-bold d-block">Last Name</label>
                        <input type="text" class="form-control" id="editSurname">
                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editAge" class="form-label fw-bold d-block">Age</label>
                        <input type="number" class="form-control" id="editAge">
                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editEmail" class="form-label fw-bold d-block">Email</label>
                        <input type="text" class="form-control" id="editEmail">
                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editPassword" class="form-label fw-bold d-block">Password</label>
                        <input type="password" class="form-control" id="editPassword">
                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editRoles" class="form-label fw-bold d-block">Roles</label>
                        <select class="form-select" id="editRoles" multiple>
                            <option value="ADMIN" data-role-id="2">ADMIN</option>
                            <option value="USER" data-role-id="1">USER</option>
                        </select>
                        <div class="invalid-feedback"></div> <!-- Для ошибок -->
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Edit</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для удаления пользователя -->
<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteUserModalLabel">Delete User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="deleteUserForm">
                    <div class="mb-3 text-center">
                        <label for="deleteId" class="form-label fw-bold d-block">ID</label>
                        <input type="text" class="form-control" id="deleteId" readonly>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deleteName" class="form-label fw-bold d-block">First Name</label>
                        <input type="text" class="form-control" id="deleteName" readonly>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deleteSurname" class="form-label fw-bold d-block">Last Name</label>
                        <input type="text" class="form-control" id="deleteSurname" readonly>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deleteAge" class="form-label fw-bold d-block">Age</label>
                        <input type="text" class="form-control" id="deleteAge" readonly>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deleteEmail" class="form-label fw-bold d-block">Email</label>
                        <input type="text" class="form-control" id="deleteEmail" readonly>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deleteRoles" class="form-label fw-bold d-block">Roles</label>
                        <select class="form-select" id="deleteRoles" multiple disabled>
                            <option value="2">ADMIN</option>
                            <option value="1">USER</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Управление вкладками
        let activeSidebarTab = localStorage.getItem("activeSidebarTab") || "#adminPanel";
        let activeAdminTab = localStorage.getItem("activeAdminTab") || "#usersTable";

        // Устанавливаем активную вкладку бокового меню
        let sidebarTabElement = document.querySelector(`[href="${activeSidebarTab}"]`);
        if (sidebarTabElement) {
            new bootstrap.Tab(sidebarTabElement).show();
            sidebarTabElement.classList.add("active-tab"); // Выделяем активную вкладку
        }

        // Устанавливаем активную вкладку внутри Admin
        let adminTabElement = document.querySelector(`[href="${activeAdminTab}"]`);
        if (adminTabElement) {
            new bootstrap.Tab(adminTabElement).show();
        }

        // Сохраняем активную вкладку при клике (боковое меню)
        document.querySelectorAll('#sideTabs .nav-link').forEach(tab => {
            tab.addEventListener("click", function(event) {
                document.querySelectorAll('#sideTabs .nav-link').forEach(el => el.classList.remove("active-tab"));
                event.target.classList.add("active-tab");
                localStorage.setItem("activeSidebarTab", event.target.getAttribute("href"));
            });
        });

        // Сохраняем активную вкладку внутри Admin
        document.querySelectorAll('.nav-tabs .nav-link').forEach(tab => {
            tab.addEventListener("click", function(event) {
                localStorage.setItem("activeAdminTab", event.target.getAttribute("href"));
            });
        });
        loadUsers();

        // Функция для отображения ошибок валидации
        function displayValidationErrors(errors) {
            clearValidationErrors();

            for (const [field, message] of Object.entries(errors)) {
                const inputElement = document.getElementById(field);
                if (inputElement) {
                    inputElement.classList.add('is-invalid');

                    // Ищем div с классом invalid-feedback внутри родительского контейнера
                    let errorElement = inputElement.parentNode.querySelector('.invalid-feedback');
                    if (errorElement) {
                        errorElement.textContent = message; // Устанавливаем текст ошибки
                    } else {
                        console.warn(`Не найден .invalid-feedback для поля ${field}`);
                    }
                }
            }
        }

        // Функция для очистки ошибок валидации
        function clearValidationErrors() {
            document.querySelectorAll('.is-invalid').forEach(el => {
                el.classList.remove('is-invalid');
            });
            document.querySelectorAll('.invalid-feedback').forEach(el => {
                el.textContent = '';
            });
        }

        // Обработка добавления нового пользователя
        document.getElementById("addUserForm").addEventListener("submit", function(event) {
            event.preventDefault();

            clearValidationErrors();

            const userData = {
                name: document.getElementById("name").value,
                surname: document.getElementById("surname").value,
                age: document.getElementById("age").value,
                username: document.getElementById("userName").value,
                password: document.getElementById("password").value,
                roles: Array.from(document.getElementById("userRole").selectedOptions)
                    .map(option => ({
                        id: option.dataset.roleId ? parseInt(option.dataset.roleId) : null,
                        name: option.value
                    }))
                    .filter(role => role.id !== null)
            };

            fetch('/api/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json(); // Ошибочный статус - получаем JSON с ошибками
                    }
                    return null; // Успешный статус, но без JSON
                })
                .then(data => {
                    console.log("Ответ сервера:", data); // Посмотрим, что приходит с бэка
                    if (data) {
                        const formattedErrors = {};
                        Object.entries(data).forEach(([key, value]) => {
                            formattedErrors[key === "username" ? "userName" : key] = value;
                        });
                        // Если есть ошибки, отображаем их
                        displayValidationErrors(formattedErrors);
                    } else {
                        loadUsers(); // Перезагружаем таблицу

                        // Переключаемся на вкладку "Users Table"
                        const usersTableTab = new bootstrap.Tab(document.querySelector('a[href="#usersTable"]'));
                        usersTableTab.show(); // Переключаемся на вкладку с таблицей пользователей

                        // Очищаем форму
                        document.getElementById("addUserForm").reset();
                    }
                })
                .catch(error => console.error("Ошибка добавления пользователя:", error));
        });

        // Обработка изменения данных пользователя
        document.getElementById("editUserForm").addEventListener("submit", function(event) {
            event.preventDefault();

            clearValidationErrors();

            const userId = document.getElementById("editId").value;
            const passwordValue = document.getElementById("editPassword").value;

            const userData = {
                id: userId,
                name: document.getElementById("editName").value,
                surname: document.getElementById("editSurname").value,
                age: document.getElementById("editAge").value,
                username: document.getElementById("editEmail").value,
                roles: Array.from(document.getElementById("editRoles").selectedOptions)
                    .map(option => ({
                        id: option.dataset.roleId ? parseInt(option.dataset.roleId) : null,
                        name: option.value
                    }))
                    .filter(role => role.id !== null)
            };

            if (passwordValue) {
                userData.password = passwordValue;
            }

            fetch(`/api/users/${userId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json(); // Ошибочный статус - получаем JSON с ошибками
                    }
                    return null; // Успешный статус, но без JSON
                })
                .then(data => {
                    if (data) {
                        const formattedErrors = {};
                        Object.entries(data).forEach(([key, value]) => {
                            // Маппинг имен полей формы, если они отличаются
                            const fieldName = key === "username" ? "editEmail" :
                                key === "name" ? "editName" :
                                    key === "surname" ? "editSurname" :
                                        key === "age" ? "editAge" :
                                            key === "password" ? "editPassword" : key;
                            formattedErrors[fieldName] = value;
                        });
                        // Если есть ошибки, отображаем их
                        displayValidationErrors(formattedErrors);
                    } else {
                        loadUsers(); // Перезагружаем таблицу
                        bootstrap.Modal.getInstance(document.getElementById("editUserModal")).hide();
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    if (typeof error === 'object') {
                        // Преобразуем имена полей для соответствия ID в форме
                        const formattedErrors = {};
                        Object.entries(error).forEach(([key, value]) => {
                            const fieldName = key === "username" ? "editEmail" :
                                            key === "name" ? "editName" :
                                            key === "surname" ? "editSurname" :
                                            key === "age" ? "editAge" :
                                            key === "password" ? "editPassword" : key;
                            formattedErrors[fieldName] = value;
                        });
                        displayValidationErrors(formattedErrors);
                    } else {
                        alert("Произошла ошибка: " + error);
                    }
                });
        });


        // Обработка удаления пользователя
        document.getElementById("deleteUserForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const userId = document.getElementById("deleteId").value;

            fetch(`/api/users/${userId}`, {
                method: 'DELETE'
            })
                .then(() => {
                    loadUsers(); // Перезагружаем таблицу
                    bootstrap.Modal.getInstance(document.getElementById("deleteUserModal")).hide(); // Закрываем модальное окно
                })
                .catch(error => console.error("Ошибка удаления пользователя:", error));
        });
    });

    // Функция для загрузки пользователей
    function loadUsers() {
        console.log("Loading users...");
        fetch('/api/users')
            .then(response => response.json())
            .then(users => {
                const tableBody = document.querySelector("#usersTable tbody");
                tableBody.innerHTML = ""; // Очищаем старые данные

                users.forEach(user => {
                    const roles = user.roles.map(role => role.name).join(", ");
                    const row = `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.surname}</td>
                            <td>${user.age}</td>
                            <td>${user.username}</td>
                            <td>${roles}</td>
                            <td>
                                <button class="btn btn-info btn-sm edit-btn"
                                    data-id="${user.id}"
                                    data-name="${user.name}"
                                    data-surname="${user.surname}"
                                    data-age="${user.age}"
                                    data-email="${user.username}"
                                    data-roles=${roles}>
                                    Edit
                                 </button>
                            </td>
                            <td>
                                <button class="btn btn-danger btn-sm delete-btn"
                                        data-id="${user.id}"
                                        data-name="${user.name}"
                                        data-surname="${user.surname}"
                                        data-age="${user.age}"
                                        data-email="${user.username}"
                                        data-roles=${roles}>
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.insertAdjacentHTML("beforeend", row);
                });

                // Назначаем обработчики событий для кнопок редактирования
                document.querySelectorAll(".edit-btn").forEach(btn => {
                    btn.addEventListener("click", () => openEditModal(btn.dataset.id));
                });

                // Назначаем обработчики событий для кнопок удаления
                console.log("Attaching delete event handlers...");
                document.querySelectorAll(".delete-btn").forEach(btn => {
                    btn.addEventListener("click", () => openDeleteModal(btn.dataset.id));
                });
            })
            .catch(error => console.error("Ошибка загрузки пользователей:", error));
    }

    // Функция для открытия модального окна редактирования
    function openEditModal(userId) {
        fetch(`/api/users/${userId}`)
            .then(response => response.json())
            .then(user => {
                document.getElementById("editId").value = user.id;
                document.getElementById("editName").value = user.name;
                document.getElementById("editSurname").value = user.surname;
                document.getElementById("editAge").value = user.age;
                document.getElementById("editEmail").value = user.username;

                // Обработка ролей
                const rolesSelect = document.getElementById("editRoles");
                const userRoleIds = user.roles.map(role => role.id.toString()); // Преобразуем id ролей пользователя в строки

                Array.from(rolesSelect.options).forEach(option => {
                    option.selected = userRoleIds.includes(option.dataset.roleId);
                });

                const editModal = new bootstrap.Modal(document.getElementById("editUserModal"));
                editModal.show();
            })
            .catch(error => console.error("Error loading user:", error));
    }

    // Функция для открытия модального окна удаления
    function openDeleteModal(userId) {

        // Находим кнопку удаления по id
        const deleteBtn = document.querySelector(`.delete-btn[data-id="${userId}"]`);

        // Получаем роли из атрибута data-roles (это строка вида "ADMIN, USER")
        const rolesString = deleteBtn.dataset.roles;

        // Заполняем форму в модальном окне соответствующими данными
        document.getElementById("deleteId").value = deleteBtn.dataset.id;
        document.getElementById("deleteName").value = deleteBtn.dataset.name;
        document.getElementById("deleteSurname").value = deleteBtn.dataset.surname;
        document.getElementById("deleteAge").value = deleteBtn.dataset.age;
        document.getElementById("deleteEmail").value = deleteBtn.dataset.email;

        // Обрабатываем роли
        const rolesSelect = document.getElementById("deleteRoles");

        // Сбрасываем все выделенные options
        Array.from(rolesSelect.options).forEach(option => {
            option.selected = false;
        });

        // Разделяем строку ролей и отмечаем соответствующие options
        if (rolesString) {
            const rolesArray = rolesString.split(", ");
            rolesArray.forEach(roleName => {
                // Находим option, соответствующий роли
                Array.from(rolesSelect.options).forEach(option => {
                    if (option.text === roleName) {
                        option.selected = true;
                    }
                });
            });
        }


        // Открываем модальное окно
        const deleteModal = new bootstrap.Modal(document.getElementById("deleteUserModal"));
        deleteModal.show();
    }

</script>
