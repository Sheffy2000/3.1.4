<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Information</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        th, td {
            text-align: center !important;
            vertical-align: middle !important;
        }
        .sidebar {
            height: 100vh;
            position: fixed;
        }
        /* Стили для активной вкладки в боковом меню */
        .nav-link.active-tab {
            background-color: #007bff !important;
            color: white !important;
        }
        .card {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- Верхняя панель -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <b th:text="${#authentication.name}"></b> with roles:
        <span th:each="role : ${#authentication.authorities}" th:text="${role.toString()} + ' '"></span>
    </span>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-light">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column" id="sideTabs">
                    <li class="nav-item">
                        <a class="nav-link active-tab" id="userTabLink" href="#userPanel">User</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Основной контент -->
        <main class="col-md-10 ms-sm-auto px-4">
            <h2 class="mt-3">User information-page</h2>

            <!-- Карточка "About user" -->
            <div class="card mt-3">
                <div class="card-header">
                    <h4>About user</h4>
                </div>
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Role</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.name}"></td>
                            <td th:text="${user.surname}"></td>
                            <td th:text="${user.age}"></td>
                            <td th:text="${user.username}"></td>
                            <td>
                                <span th:each="role : ${user.roles}" th:text="${role.name} + ' '"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Управление активной вкладкой в боковом меню
        const currentPath = window.location.pathname;
        const sidebarLinks = document.querySelectorAll('#sideTabs .nav-link');

        sidebarLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active-tab');
            } else {
                link.classList.remove('active-tab');
            }
        });
        // Принудительно добавляем класс active-tab для вкладки "User"
        const userTabLink = document.getElementById('userTabLink');
        if (userTabLink) {
            userTabLink.classList.add('active-tab');
        }
    });
</script>

</body>
</html>
