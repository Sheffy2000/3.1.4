<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        th, td {
            text-align: center !important;
            vertical-align: middle !important;
        }
        .sidebar {
            height: 100vh;
            position: fixed;
        }
        /* Стили для активной вкладки в боковом меню */
        .nav-link.active-tab {
            background-color: #007bff !important;
            color: white !important;
        }
        /* Затемняем фон для панели Admin */
        .main-panel {
            background-color: rgba(0, 0, 0, 0.2);
        }/* Затемнённый фон */
    </style>
</head>
<body>

<!-- Верхняя панель -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <b th:text="${#authentication.name}"></b> with roles:
        <span th:each="role : ${#authentication.authorities}" th:text="${role.toString()} + ' '"></span>
    </span>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-light">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column" id="sideTabs">
                    <li class="nav-item">
                        <a class="nav-link" id="adminTabLink" data-bs-toggle="tab" href="#adminPanel">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="userTabLink" data-bs-toggle="tab" href="#userPanel">User</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Основной контент -->
        <main class="col-md-10 ms-sm-auto px-4" >
            <div class="tab-content">
                <!-- Вкладка Admin -->
                <div id="adminPanel" class="tab-pane fade show active">
                    <h2 class="mt-3">Admin panel</h2>

                    <!-- Вкладки внутри Admin -->
                    <ul class="nav nav-tabs">
                        <li class="nav-item">
                            <a class="nav-link active" data-bs-toggle="tab" href="#usersTable">Users Table</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="tab" href="#newUser">New User</a>
                        </li>
                    </ul>

                    <!-- Контент вкладок -->
                    <div class="tab-content mt-3">
                        <div id="usersTable" class="tab-pane fade show active">
                            <h4>All users</h4>
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered">
                                    <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.id}"></td>
                                        <td th:text="${user.name}"></td>
                                        <td th:text="${user.surname}"></td>
                                        <td th:text="${user.age}"></td>
                                        <td th:text="${user.username}"></td>
                                        <td>
                                            <span th:each="role : ${user.roles}" th:text="${role.name} + ' '"></span>
                                        </td>
                                        <td>
                                            <a th:href="@{/editUser(id=${user.id})}" class="btn btn-info btn-sm">Edit</a>
                                        </td>
                                        <td>
                                            <a th:href="@{/deleteUser(id=${user.id})}" class="btn btn-danger btn-sm">Delete</a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div id="newUser" class="tab-pane fade">
                            <h4>Add new user</h4>
                            <!-- Форма для добавления нового пользователя -->
                            <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
                                <form th:action="@{/addUser}" th:object="${user}" method="post" class="w-25 mx-auto">
                                    <div class="mb-3">
                                        <label for="name" class="form-label text-center fw-bold d-block">First name</label>
                                        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Enter name" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="surname" class="form-label text-center fw-bold d-block">Last name</label>
                                        <input type="text" class="form-control" id="surname" th:field="*{surname}" placeholder="Enter surname" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="age" class="form-label text-center fw-bold d-block">Age</label>
                                        <input type="number" class="form-control" id="age" th:field="*{age}" placeholder="Enter age" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="userName" class="form-label text-center fw-bold d-block">Email</label>
                                        <input type="text" class="form-control" id="userName" th:field="*{username}" placeholder="Enter email" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label text-center fw-bold d-block">Password</label>
                                        <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Enter password" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="userRole" class="form-label text-center fw-bold d-block">Role</label>
                                        <select class="form-select" id="userRole" th:field="*{roles}" multiple>
                                            <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role}"></option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100">Add new user</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Вкладка User -->
                <div id="userPanel" class="tab-pane fade">
                    <h2 class="mt-3">User information-page</h2>

                    <!-- Карточка "About user" -->
                    <div class="card mt-3">
                        <div class="card-header">
                            <h4>About user</h4>
                        </div>
                        <div class="card-body">
                            <table class="table table-bordered">
                                <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr>
                                    <td th:text="${activeUser.id}"></td>
                                    <td th:text="${activeUser.name}"></td>
                                    <td th:text="${activeUser.surname}"></td>
                                    <td th:text="${activeUser.age}"></td>
                                    <td th:text="${activeUser.username}"></td>
                                    <td>
                                        <span th:each="role : ${activeUser.roles}" th:text="${role.name} + ' '"></span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Модальное окно для редактирования пользователя -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editUserForm" th:action="@{/editUser}" th:object="${user}" method="post" novalidate>
                    <!-- Поле для отображения ID (только для чтения) -->
                    <div class="mb-3 text-center">
                        <label for="editId" class="form-label fw-bold d-block">ID</label>
                        <input type="text" class="form-control" id="editId" th:field="*{id}" readonly>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editName" class="form-label fw-bold d-block">First Name</label>
                        <input type="text" class="form-control" id="editName" th:field="*{name}">
                        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div><br>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editSurname" class="form-label fw-bold d-block">Last Name</label>
                        <input type="text" class="form-control" id="editSurname" th:field="*{surname}">
                        <div th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></div><br>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editAge" class="form-label fw-bold d-block">Age</label>
                        <input type="number" class="form-control" id="editAge" th:field="*{age}">
                        <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div><br>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editEmail" class="form-label fw-bold d-block">Email</label>
                        <input type="text" class="form-control" id="editEmail" th:field="*{username}">
                        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div><br>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editPassword" class="form-label fw-bold d-block">Password</label>
                        <input type="password" class="form-control" id="editPassword" th:field="*{password}">
                        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div><br>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="editRoles" class="form-label fw-bold d-block">Roles</label>
                        <select class="form-select" id="editRoles" th:field="*{roles}" multiple required>
                            <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                        </select>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Edit</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для удаления пользователя -->
<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteUserModalLabel">Delete User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="deleteUserForm" th:action="@{/deleteUser}" th:object="${user}" method="post" novalidate>
                    <!-- Поле для отображения ID (только для чтения) -->
                    <div class="mb-3 text-center">
                        <label for="deleteId" class="form-label fw-bold d-block">ID</label>
                        <input type="text" class="form-control" id="deleteId" th:field="*{id}" readonly>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="deleteName" class="form-label fw-bold d-block">First Name</label>
                        <input type="text" class="form-control" id="deleteName" th:field="*{name}" readonly>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="deleteSurname" class="form-label fw-bold d-block">Last Name</label>
                        <input type="text" class="form-control" id="deleteSurname" th:field="*{surname}" readonly>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="deleteAge" class="form-label fw-bold d-block">Age</label>
                        <input type="number" class="form-control" id="deleteAge" th:field="*{age}" readonly>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="deleteEmail" class="form-label fw-bold d-block">Email</label>
                        <input type="email" class="form-control" id="deleteEmail" th:field="*{username}" readonly>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="deletePassword" class="form-label fw-bold d-block">Password</label>
                        <input type="password" class="form-control" id="deletePassword" th:field="*{password}" readonly>
                    </div>

                    <div class="mb-3 text-center">
                        <label for="deleteRoles" class="form-label fw-bold d-block">Roles</label>
                        <select class="form-select" id="deleteRoles" th:field="*{roles}" multiple disabled>
                            <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                        </select>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Delete</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        // Проверяем, нужно ли открыть модальное окно для редактирования
        const openEditModal = [[${openEditModal}]];

        if (openEditModal) {
            const editModal = new bootstrap.Modal(document.getElementById("editUserModal"));
            editModal.show();
        }
        // Проверяем, нужно ли открыть модальное окно для удаления
        const openDeleteModal = [[${openDeleteModal}]];

        if (openDeleteModal) {
            const deleteModal = new bootstrap.Modal(document.getElementById("deleteUserModal"));
            deleteModal.show();
        }

        // Управление вкладками
        let activeSidebarTab = localStorage.getItem("activeSidebarTab") || "#adminPanel";
        let activeAdminTab = localStorage.getItem("activeAdminTab") || "#usersTable";

        // Устанавливаем активную вкладку бокового меню
        let sidebarTabElement = document.querySelector(`[href="${activeSidebarTab}"]`);
        if (sidebarTabElement) {
            new bootstrap.Tab(sidebarTabElement).show();
            sidebarTabElement.classList.add("active-tab"); // Выделяем активную вкладку
        }

        // Устанавливаем активную вкладку внутри Admin
        let adminTabElement = document.querySelector(`[href="${activeAdminTab}"]`);
        if (adminTabElement) {
            new bootstrap.Tab(adminTabElement).show();
        }

        // Сохраняем активную вкладку при клике (боковое меню)
        document.querySelectorAll('#sideTabs .nav-link').forEach(tab => {
            tab.addEventListener("click", function(event) {
                document.querySelectorAll('#sideTabs .nav-link').forEach(el => el.classList.remove("active-tab"));
                event.target.classList.add("active-tab");
                localStorage.setItem("activeSidebarTab", event.target.getAttribute("href"));
            });
        });

        // Сохраняем активную вкладку внутри Admin
        document.querySelectorAll('.nav-tabs .nav-link').forEach(tab => {
            tab.addEventListener("click", function(event) {
                localStorage.setItem("activeAdminTab", event.target.getAttribute("href"));
            });
        });
    });

</script>

</body>
</html>
